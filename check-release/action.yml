name: Check Unity package release
description: Check that a release tag names the package's version, and that committed binaries are newer than their source.

# The binary check reads history, so check out the tag with fetch-depth 0.

inputs:
  tag:
    description: Release tag, which must be v<version>.
    required: true
  package-path:
    description: Folder that holds package.json.
    default: .
  source:
    description: >-
      Paths of the native source, one per line, relative to the repository root. Give these together with binaries.
    default: ''
  binaries:
    description: >-
      Paths of the committed binaries that a workflow builds from source, one per line. Empty skips the binary check.
    default: ''

runs:
  using: composite
  steps:
    # The registry takes the version from package.json, so a tag that names another version would publish something
    # other than what the release says.
    - name: Check that the tag names the package's version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        version=$(jq -er .version "$PACKAGE_PATH/package.json")
        if [[ "$TAG" != "v$version" ]]; then
          echo "::error::The tag $TAG does not match version $version in package.json. Tag the release v$version."
          exit 1
        fi

    # A workflow commits the binaries after every change to their source. A release that was tagged before that commit
    # landed would ship binaries built from older source.
    - name: Check that the binaries were built from the tagged source
      if: inputs.binaries != ''
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        BINARIES: ${{ inputs.binaries }}
      run: |
        if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
          echo "::error::The checkout is shallow, so the binaries cannot be checked. Check out with fetch-depth: 0."
          exit 1
        fi
        mapfile -t source_paths < <(grep -v '^[[:space:]]*$' <<< "$SOURCE")
        mapfile -t binary_paths < <(grep -v '^[[:space:]]*$' <<< "$BINARIES")
        source_commit=$(git rev-list -1 HEAD -- "${source_paths[@]}")
        binary_commit=$(git rev-list -1 HEAD -- "${binary_paths[@]}")
        if [[ -z "$source_commit" ]]; then
          echo "::error::No commit touches the source paths. Pass them in the source input."
          exit 1
        fi
        if [[ -z "$binary_commit" ]] || ! git merge-base --is-ancestor "$source_commit" "$binary_commit"; then
          echo "::error::The binaries are older than their source. Wait for the workflow that builds them to commit them, then tag that commit."
          exit 1
        fi

# Small native helpers for things that Unity's C# API doesn't expose, for Windows, Linux and macOS. Its release
# workflow attaches the package, with the native plug-in for all three platforms, to each GitHub release.
name = "io.github.ksp1retooled.native"
repo = "KSP1Retooled/Retooled.Native"
asset_match = '^io\.github\.ksp1retooled\.native-.*\.tgz$'
prereleases = false

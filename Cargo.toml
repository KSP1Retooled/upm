[package]
name = "upm-registry"
description = "Generates a static Unity package registry from GitHub releases."
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.0"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check the generator against the published packages
        uses: actions/checkout@v5
        with:
          repository: KSP1Retooled/ksp1retooled.github.io
          ref: gh-pages
          sparse-checkout: upm
          path: published
          persist-credentials: false
      - run: |
          mv published/upm registry
          cargo run --locked -- index
          cargo run --locked -- check

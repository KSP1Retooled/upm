name: Update packages

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo that made the release (owner/name). Empty updates every package.
        required: false
      tag:
        description: Release tag. Empty uses the latest release.
        required: false
  workflow_call:
    inputs:
      all:
        description: Include release history for every configured package.
        type: boolean
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Read the deployed state after acquiring the lock. A retry also starts from that state.
    concurrency:
      group: deploy-registry
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Read previously published versions
        uses: actions/checkout@v5
        with:
          repository: KSP1Retooled/ksp1retooled.github.io
          ref: gh-pages
          sparse-checkout: upm
          path: published
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Generate and validate registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
          ALL_RELEASES: ${{ inputs.all }}
        run: |
          mv published/upm registry
          cargo build --locked
          if [[ "$ALL_RELEASES" == "true" && -z "$(find configs -name '*.toml' -print -quit)" ]]; then
            ./target/debug/upm-registry index
          else
            args=()
            [[ "$ALL_RELEASES" == "true" ]] && args+=(--all)
            [[ -n "$REPO" ]] && args+=(--repo "$REPO")
            [[ -n "$TAG" ]] && args+=(--tag "$TAG")
            ./target/debug/upm-registry generate "${args[@]}"
          fi
          ./target/debug/upm-registry check

      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: registry/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: KSP1Retooled
          repositories: ksp1retooled.github.io
          permission-contents: write

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository-name: KSP1Retooled/ksp1retooled.github.io
          branch: gh-pages
          folder: registry
          target-folder: upm
          force: false

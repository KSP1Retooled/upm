name: Publish package

# Adds a release's package tarball to the registry. Attach a signed tarball to the release first, with the sign action.

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag. Defaults to the caller's release or tag.
        type: string
    secrets:
      APP_CLIENT_ID:
        description: Client ID of the organization's automation app, which may start workflows in KSP1Retooled/upm.
        required: true
      APP_PRIVATE_KEY:
        description: Private key of the same app.
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Check release tag
        run: |
          if [[ -z "$TAG" ]]; then
            echo "::error::Pass the published release tag using the tag input."
            exit 1
          fi

      # The caller's own token cannot start a workflow in another repository, so the automation app grants one that
      # can, limited to this repository.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: KSP1Retooled
          repositories: upm
          permission-actions: write

      - name: Publish to the registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          runs=repos/KSP1Retooled/upm/actions
          run_id=$(gh api "$runs/workflows/update.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -f ref=main -f "inputs[repo]=$GITHUB_REPOSITORY" -f "inputs[tag]=$TAG" \
            --jq '.workflow_run_id')
          echo "Registry run: https://github.com/KSP1Retooled/upm/actions/runs/$run_id"
          while true; do
            result=$(gh api "$runs/runs/$run_id" --jq '.conclusion // "pending"')
            case "$result" in
              success) exit 0 ;;
              pending) sleep 15 ;;
              *) echo "::error::Registry run finished with $result"; exit 1 ;;
            esac
          done

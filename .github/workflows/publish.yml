name: Publish package

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag. Defaults to the caller's release or tag.
        type: string
      package-path:
        description: Directory to npm pack and attach to the release. Omit to use existing release assets.
        type: string
    secrets:
      UPM_PUBLISH_TOKEN:
        description: Token with Actions write access to KSP1Retooled/upm.
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Check release tag
        run: |
          if [[ -z "$TAG" ]]; then
            echo "::error::Pass the published release tag using the tag input."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: inputs.package-path != ''
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Pack and attach the Unity package
        if: inputs.package-path != ''
        working-directory: ${{ inputs.package-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" | jq -er '.[0].filename')
          assets=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -- "$TAG")
          if jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<< "$assets" > /dev/null; then
            echo "Using existing release asset $asset"
          else
            gh release upload --repo "$GITHUB_REPOSITORY" -- "$TAG" "$RUNNER_TEMP/$asset"
          fi

      - name: Publish to the registry
        env:
          GH_TOKEN: ${{ secrets.UPM_PUBLISH_TOKEN }}
        run: |
          runs=repos/KSP1Retooled/upm/actions
          run_id=$(gh api "$runs/workflows/update.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -f ref=main -f "inputs[repo]=$GITHUB_REPOSITORY" -f "inputs[tag]=$TAG" \
            --jq '.workflow_run_id')
          echo "Registry run: https://github.com/KSP1Retooled/upm/actions/runs/$run_id"
          while true; do
            result=$(gh api "$runs/runs/$run_id" --jq '.conclusion // "pending"')
            case "$result" in
              success) exit 0 ;;
              pending) sleep 15 ;;
              *) echo "::error::Registry run finished with $result"; exit 1 ;;
            esac
          done

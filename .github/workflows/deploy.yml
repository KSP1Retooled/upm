name: Deploy registry

on:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/update.yml
    with:
      all: true
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
